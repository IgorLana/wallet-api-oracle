# Combine with docker-compose.yml. Migrations run only when explicitly requested.
# They are intentionally separate from the Spring Boot application.
services:
  flyway-audit:
    image: flyway/flyway:13.12.2
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      FLYWAY_USER: WALLET_AUDIT
      FLYWAY_PASSWORD: ${WALLET_AUDIT_PASSWORD:?Set WALLET_AUDIT_PASSWORD in .env}
      FLYWAY_DEFAULT_SCHEMA: WALLET_AUDIT
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "20"
    volumes:
      - ./db/migration/audit:/flyway/sql:ro
    command: migrate

  flyway-owner:
    image: flyway/flyway:13.12.2
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      FLYWAY_USER: WALLET_OWNER
      FLYWAY_PASSWORD: ${WALLET_OWNER_PASSWORD:?Set WALLET_OWNER_PASSWORD in .env}
      FLYWAY_DEFAULT_SCHEMA: WALLET_OWNER
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "20"
    volumes:
      - ./db/migration/owner:/flyway/sql:ro
    command: migrate
