spring.application.name=wallet-api
server.port=${SERVER_PORT:8080}

# Runtime connection: the app account is never an owner/migration account.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=WALLET_APP
spring.datasource.password=${WALLET_APP_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=1

# Required secret; no default value. Keep it outside Git.
wallet.api-key=${WALLET_API_KEY}
